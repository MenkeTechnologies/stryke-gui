name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dylib: libstryke_gui.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            dylib: libstryke_gui.so
            # Native aarch64 runner; mark allow_failure until proven stable
            # for this repo's cross-link path. The macOS targets cover the
            # arm64 user base in the meantime.
            allow_failure: true
          - os: macos-latest
            target: x86_64-apple-darwin
            dylib: libstryke_gui.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            dylib: libstryke_gui.dylib
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI deps (enigo + xcap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libwayland-egl1 \
            libpipewire-0.3-dev libspa-0.2-dev \
            libegl-dev libgl1-mesa-dev libgles-dev libgbm-dev \
            libxcb1-dev libxrandr-dev libxcb-randr0-dev \
            libxinerama-dev libxcursor-dev libxi-dev \
            libdbus-1-dev libudev-dev \
            pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build cdylib
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage release tarball
        id: stage
        # The tarball layout must match what stryke's
        # `pkg::commands::install_global_from_github` expects:
        #
        #   stryke-gui-<tag>-<triple>/
        #     stryke.toml          ([package] + [ffi] + [bin])
        #     lib/
        #       GUI.stk            (stryke-side wrapper)
        #       libstryke_gui.{dylib,so}   (FFI cdylib)
        #     bin/
        #       gui-test.stk       (installable smoke-test launcher)
        #
        # After install, `lib/GUI.stk`'s `use GUI` triggers the FFI
        # auto-load (pkg::commands::try_load_ffi_for) which dlopens the
        # sibling cdylib. The `[bin] gui-test = "bin/gui-test.stk"`
        # entry causes `s pkg install -g` to drop a launcher at
        # ~/.stryke/bin/gui-test pointing at bin/gui-test.stk in the
        # store.
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          TRIPLE="${{ matrix.target }}"
          STEM="stryke-gui-${TAG}-${TRIPLE}"
          mkdir -p "staging/${STEM}/lib" "staging/${STEM}/bin"
          cp stryke.toml "staging/${STEM}/"
          cp lib/*.stk "staging/${STEM}/lib/"
          cp "target/${TRIPLE}/release/${{ matrix.dylib }}" "staging/${STEM}/lib/"
          cp bin/gui-test.stk "staging/${STEM}/bin/"
          ARCHIVE="${STEM}.tar.gz"
          tar -C staging -czf "${ARCHIVE}" "${STEM}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" | awk '{print $1}' > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" | awk '{print $1}' > "${ARCHIVE}.sha256"
          fi
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            ${{ steps.stage.outputs.archive }}
            ${{ steps.stage.outputs.archive }}.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
