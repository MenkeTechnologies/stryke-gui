[package]
name = "stryke-gui"
version = "0.19.0"
description = "GUI automation (mouse, keyboard, screen, pixel, screenshot) for stryke. cdylib package — loaded in-process via dlopen on first `use GUI`. No subprocess fork per call; the Enigo input handle persists across calls."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-gui"
edition = "2026"

[ffi]
lib-name = "stryke_gui"
namespace = "GUI"
exports = [
    "gui__clipboard_get",
    "gui__clipboard_set",
    "gui__display_screenshot",
    "gui__displays",
    "gui__key_down",
    "gui__key_hotkey",
    "gui__key_keys",
    "gui__key_press",
    "gui__key_type",
    "gui__key_up",
    "gui__mouse_button_hold",
    "gui__mouse_click",
    "gui__mouse_drag",
    "gui__mouse_move",
    "gui__mouse_move_rel",
    "gui__mouse_pos",
    "gui__mouse_scroll",
    "gui__pixel",
    "gui__pixel_match",
    "gui__screen_on_screen",
    "gui__screen_size",
    "gui__screenshot",
    "gui__parse_hotkey",
    "gui__format_hotkey",
    "gui__parse_color",
    "gui__format_color",
    "gui__color_distance",
    "gui__delta_e",
    "gui__mix",
    "gui__rotate_hue",
    "gui__adjust_lightness",
    "gui__adjust_saturation",
    "gui__contrast_ratio",
    "gui__relative_luminance",
    "gui__to_hsl",
    "gui__to_hsv",
    "gui__from_hsv",
    "gui__to_hwb",
    "gui__from_hwb",
    "gui__from_hsl",
    "gui__to_cmyk",
    "gui__from_cmyk",
    "gui__invert",
    "gui__grayscale",
    "gui__sepia",
    "gui__posterize",
    "gui__temperature",
    "gui__alpha_over",
    "gui__is_dark",
    "gui__to_lab",
    "gui__from_lab",
    "gui__blend_lab",
    "gui__gradient",
    "gui__to_xyz",
    "gui__from_xyz",
    "gui__to_oklab",
    "gui__from_oklab",
    "gui__blend_oklab",
    "gui__scheme",
    "gui__name_color",
]

# Installable smoke-test launcher. `s pkg install -g` writes
# ~/.stryke/bin/gui-test as a sh shim that execs stryke against the
# store entry's bin/gui-test.stk. Lets users verify the install +
# FFI roundtrip after `s pkg install -g github.com/...`.
[bin]
gui-test = "bin/gui-test.stk"

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
